aid: co2-ai
name: CO2 AI
description: >-
  CO2 AI is an enterprise sustainability platform that helps organizations
  measure, reduce, and report carbon emissions across their entire value chain.
  It combines trustworthy emissions data, AI-powered workflows, and supply-chain
  collaboration to baseline and track Scope 1, 2, and 3 corporate footprints,
  compute audit-ready product carbon footprints (PCF) at scale across thousands
  of SKUs (PACT, TfS, PEF, ISO aligned), engage suppliers for primary data, and
  build decarbonization plans ranked by Marginal Abatement Cost. Backed by
  Partech and surfaced to the API Evangelist network as a climate-sector company
  profile. No public developer API is published as of this enrichment pass; the
  profile captures the company's security, trust, and legal surface.
